name: Gerar APK Automaticamente

on:
  push:
    branches: [ principal ]

jobs:
  build:
    name: Compilar e gerar APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./aplicativo

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Dar permissão ao gradlew
        run: chmod +x gradlew

      - name: Compilar com Gradle
        run: ./gradlew assembleRelease

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: App-Psicologia-Estuda
          path: aplicativo/build/outputs/apk/release/app-release-unsigned.apk
