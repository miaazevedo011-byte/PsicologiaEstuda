name: Gerar APK Automaticamente

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Compilar e gerar APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ver arquivos
        run: ls -la

      - name: Entrar na pasta e dar permissão
        run: |
          cd aplicativo
          chmod +x gradlew

      - name: Compilar APK
        run: |
          cd aplicativo
          ./gradlew assembleRelease

      - name: Salvar APK pronto
        uses: actions/upload-artifact@v4
        with:
          name: App-Psicologia-Estuda
          path: aplicativo/build/outputs/apk/release/app-release-unsigned.apk
